name: Build Librespot with Cross

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone librespot source
        run: |
          git clone https://github.com/librespot-org/librespot.git

      - name: Install cross tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build librespot with ALSA and Rustls
        env:
          # Принудительно отключаем pkg-config для alsa-sys и указываем, что линковать нужно системную alsa
          ALSA_NO_PKG_CONFIG: "1"
          CFLAGS_arm_unknown_linux_gnueabihf: "-I/usr/include/arm-linux-gnueabihf"
          LDFLAGS_arm_unknown_linux_gnueabihf: "-L/usr/lib/arm-linux-gnueabihf"
        run: |
          cd librespot
          cross build --release --target arm-unknown-linux-gnueabihf --no-default-features --features "alsa-backend,librespot-oauth/rustls-tls-webpki-roots"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librespot-arm-alsa
          path: librespot/target/arm-unknown-linux-gnueabihf/release/librespot

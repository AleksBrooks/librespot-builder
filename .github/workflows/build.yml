name: Build Librespot with Cross

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone librespot source
        run: |
          git clone https://github.com/librespot-org/librespot.git

      - name: Install cross tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build librespot with ALSA for ARM
        run: |
          cd librespot
          cross build --release --target arm-unknown-linux-gnueabihf --no-default-features --features alsa-backend

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librespot-arm-alsa
          path: librespot/target/arm-unknown-linux-gnueabihf/release/librespot
